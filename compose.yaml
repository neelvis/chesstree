services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chesstree
      POSTGRES_USER: chesstree
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - chesstree-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U chesstree" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chesstree-postgres:
