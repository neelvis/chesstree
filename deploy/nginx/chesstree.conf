map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $uri $chesstree_auth_client {
    default "";
    ~^/api/v1/auth/(register|login)$ $binary_remote_addr;
}

limit_req_zone $chesstree_auth_client zone=chesstree_auth:10m rate=10r/m;

upstream chesstree_backend {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    listen [::]:80;
    server_name chess-tree.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chess-tree.online;

    ssl_certificate /etc/letsencrypt/live/chess-tree.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chess-tree.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ChessTreeTLS:10m;
    ssl_session_timeout 1d;

    root /opt/chesstree/current/web;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health {
        proxy_pass http://chesstree_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=chesstree_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://chesstree_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
